# 开发环境（application-dev.yml）
app:
  webauthn:
    rp-id: localhost
    origins: http://localhost:8988
  cors:
    allowed-origins:
      - "*"
    allow-credentials: true
  upload:
    dir: ${user.home}/gauzynote/uploads/  # 自动解析为当前用户目录下，也可手动指定绝对路径

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gauzy_note?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    password:
  sql:
    init:
      mode: NEVER  # 开发环境用always，生产环境建议改为never；ALWAYS：始终初始化数据库;NEVER: 不加载。
      schema-locations: classpath:schema.sql  # 建表脚本
      data-locations: classpath:data.sql      # 插数据脚本
      encoding: UTF-8

logging:
  level:
    com.gauzynote: debug
    # 打印SQL初始化的详细日志（建表、插数据、脚本执行等）
    org.springframework.jdbc.datasource.init:   DEBUG
    org.apache.tomcat.util.http.parser.Cookie: off