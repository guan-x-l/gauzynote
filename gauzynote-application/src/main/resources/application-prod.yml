# 生产环境（application-prod.yml）
app:
  webauthn:
    rp-id: example.com
    origins: https://example.com,https://www.example.com
  cors:
    allowed-origins:
      - "https://example.com"
      - "https://www.example.com"
    allow-credentials: true  # 生产环境按需开启
  upload:
    dir: /home/gauzynote/uploads/

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gauzy_note?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
    username: root
    password:
  redis:
    host: localhost
    port: 6379
    password:
  sql:
    init:
      mode: never  # 开发环境用always，生产环境建议改为never；ALWAYS：始终初始化数据库;NEVER: 不加载。
      schema-locations: classpath:schema.sql  # 建表脚本
      data-locations: classpath:data.sql      # 插数据脚本
      encoding: UTF-8

# 日志配置
logging:
  level:
    com.gauzynote: info
    org.apache.tomcat.util.http.parser.Cookie: off
  file:
    name: app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 300MB
