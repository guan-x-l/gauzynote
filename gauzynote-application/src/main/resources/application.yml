app:
  webauthn:
    rp-name: GauzyNote
    timeout-ms: 60000
    challenge-ttl-seconds: 300
    require-user-verification: false
  upload:
    # 总上传容量限制bytes(10GB)
    max-total-capacity: 10737418240
    # 图片配置
    image:
      dir: images/
      allowed-content-types: image/jpeg,image/png,image/jpg,image/gif,image/webp
      # 图片资源过期时间(秒)
      max-age: 864000
    # 文件配置
    other-file:
      dir: file/



# 开发环境配置
server:
  port: 8989
  tomcat:
    uri-encoding: UTF-8
    max-connections: 10000  # 最大连接数
    threads:
      max: 800              # 最大工作线程数
      min-spare: 100        # 最小空闲线程数
    accept-count: 100       # 等待队列长度
    # 设置连接超时时间（单位：毫秒）
    connection-timeout: 20000
    # 设置为 -1 表示不限制吞没大小（即允许读取并丢弃任意大小的剩余数据）
    max-swallow-size: -1
  servlet:
    context-path: /service/gauzynote


# Spring配置
spring:
  profiles:
    active: prod
  messages:
    basename: i18n/messages
    encoding: UTF-8
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 初始化脚本配置
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  redis:
    database: 15
    timeout: 15000
    lettuce:
      pool:
        # 连接池中的最大空闲连接，默认值也是8。
        max-idle: 16
        # 连接池中的最小空闲连接，默认值也是0。
        min-idle: 8
        # 如果赋值为-1，则表示不限制；如果pool已经分配了maxActive个jedis实例，则此时pool的状态为exhausted(耗尽)
        max-active: 32
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=600s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      file-size-threshold: 2KB
      resolve-lazily: false


token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: wwssadadbaba
  # 令牌有效期（分钟）
  expireTime: 1200


# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.gauzynote.**.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*.xml

# 日志配置
#logging:
